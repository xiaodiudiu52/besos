name: 分析极GO原厂固件

on:
  push:
    paths:
      - '.github/workflows/analyze-stock.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解包原厂固件（带错误捕获）
        run: |
          mkdir -p /tmp/work && cd /tmp/work
          sudo apt-get update -qq 2>&1 | tail -1 || echo "APT_UPDATE_FAIL"
          sudo apt-get install -y -qq squashfs-tools 2>&1 | tail -2 || echo "APT_INSTALL_FAIL"

          curl -sL -o stock.bin "https://gitee.com/wter2000/HIWIFI/raw/master/BIN/HC5611-sysupgrade-20170606-44f46c15.bin" || echo "DOWNLOAD_FAIL"
          ls -lh stock.bin 2>/dev/null || echo "NO_FILE"
          md5sum stock.bin 2>/dev/null

          dd if=stock.bin of=rootfs.squashfs bs=1024 skip=1408 2>/dev/null || echo "DD_FAIL"
          ls -lh rootfs.squashfs 2>/dev/null || echo "NO_SQUASHFS"

          echo "===== superblock 信息 ====="
          unsquashfs -s rootfs.squashfs 2>&1 | head -15 || echo "SUPERBLOCK_FAIL"

          echo "===== 解压尝试 ====="
          unsquashfs -q -d rootfs rootfs.squashfs 2>&1 | head -15 || echo "UNSQUASH_FAIL"

          echo "===== 解压结果 ====="
          ls rootfs 2>/dev/null | head -12 || echo "(空，解压失败)"

      - name: 生成报告（即使上一步失败也执行）
        if: always()
        run: |
          cd /tmp/work 2>/dev/null || mkdir -p /tmp/work && cd /tmp/work
          mkdir -p "$GITHUB_WORKSPACE/stock-analysis"
          R="$GITHUB_WORKSPACE/stock-analysis/report.txt"
          {
            echo "===== 顶层目录 ====="
            ls rootfs/ 2>/dev/null || echo "(无)"
            echo ""
            echo "===== 是否使用 LuCI ====="
            [ -d rootfs/usr/lib/lua/luci ] && echo "有 LuCI" || echo "无 LuCI（自研 UI）"
            echo ""
            echo "===== www 目录 ====="
            ls rootfs/www/ 2>/dev/null || echo "(无 www)"
            echo ""
            echo "===== www 文件数 ====="
            find rootfs/www -type f 2>/dev/null | wc -l
            echo ""
            echo "===== www 目录树 ====="
            find rootfs/www -maxdepth 2 2>/dev/null | head -60
            echo ""
            echo "===== JS 文件 ====="
            find rootfs/www -name "*.js" 2>/dev/null | head -12
            echo ""
            echo "===== CSS 文件 ====="
            find rootfs/www -name "*.css" 2>/dev/null | head -8
            echo ""
            echo "===== 极路由自研痕迹 ====="
            find rootfs -maxdepth 3 -iname "*hiwifi*" 2>/dev/null | head -20
            echo ""
            echo "===== etc/config ====="
            ls rootfs/etc/config/ 2>/dev/null | tr '\n' ' '
            echo ""
            echo "===== init.d 服务 ====="
            ls rootfs/etc/init.d/ 2>/dev/null | tr '\n' ' '
            echo ""
            echo "===== Web 服务器 ====="
            ls rootfs/usr/sbin/ 2>/dev/null | grep -iE "http|nginx|lighttpd|uhttpd" | tr '\n' ' '
            echo ""
            echo "===== 后端语言 ====="
            ls rootfs/usr/bin/ 2>/dev/null | grep -iE "^(lua|python|php|node)" | tr '\n' ' '
            echo ""
            echo "===== opkg 已装包 ====="
            grep "^Package:" rootfs/usr/lib/opkg/status 2>/dev/null | head -50 | tr '\n' ' '
          } > "$R" 2>&1
          cd rootfs 2>/dev/null && tar czf "$GITHUB_WORKSPACE/stock-analysis/www.tar.gz" www 2>/dev/null || echo "打包跳过"
          ls -lh "$GITHUB_WORKSPACE/stock-analysis/" 2>/dev/null

      - name: 回传分析结果
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.email "action@users.noreply.github.com"
          git config user.name "GitHub Action"
          git add stock-analysis/ 2>/dev/null
          git commit -m "原厂固件分析结果 [skip ci]" 2>/dev/null || echo "无变化"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/xiaodiudiu52/besos.git HEAD:master 2>&1 | tail -2
