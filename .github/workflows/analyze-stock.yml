name: 分析极GO原厂固件

on:
  push:
    paths:
      - '.github/workflows/analyze-stock.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解包原厂固件
        run: |
          mkdir -p /tmp/work && cd /tmp/work
          exec > >(tee -a /tmp/work/unpack.log) 2>&1

          sudo apt-get update -qq 2>&1 | tail -1 || echo "APT_UPDATE_FAIL"
          sudo apt-get install -y -qq squashfs-tools p7zip-full 2>&1 | tail -2 || echo "APT_INSTALL_FAIL"

          curl -sL -o stock.bin "https://gitee.com/wter2000/HIWIFI/raw/master/BIN/HC5611-sysupgrade-20170606-44f46c15.bin" || echo "DOWNLOAD_FAIL"
          ls -lh stock.bin
          md5sum stock.bin

          # 自动定位 squashfs magic（hsqs），不靠猜偏移
          OFF=$(python3 -c "
          d=open('/tmp/work/stock.bin','rb').read()
          p=d.find(b'hsqs')
          print(p//1024 if p>0 else 1408)
          ")
          echo "squashfs 起始 KB = $OFF"
          dd if=stock.bin of=rootfs.squashfs bs=1024 skip=$OFF 2>/dev/null
          ls -lh rootfs.squashfs

          echo "===== superblock ====="
          unsquashfs -s rootfs.squashfs 2>&1 | head -20

          echo "===== 解压 ====="
          unsquashfs -q -d rootfs rootfs.squashfs 2>&1 | head -10

          echo "===== 解压结果 ====="
          ls rootfs 2>/dev/null | head -12 || echo "(空)"

      - name: 生成报告
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/stock-analysis"
          R="$GITHUB_WORKSPACE/stock-analysis/report.txt"
          {
            echo "########## 解包日志 ##########"
            cat /tmp/work/unpack.log 2>/dev/null || echo "(无日志)"
            echo ""
            echo "########## 目录结构 ##########"
            echo "===== 顶层 ====="
            ls /tmp/work/rootfs/ 2>/dev/null || echo "(无)"
            echo ""
            echo "===== LuCI? ====="
            [ -d /tmp/work/rootfs/usr/lib/lua/luci ] && echo "有 LuCI" || echo "无 LuCI（自研 UI）"
            echo ""
            echo "===== www ====="
            ls /tmp/work/rootfs/www/ 2>/dev/null || echo "(无)"
            echo ""
            echo "===== www 文件数 ====="
            find /tmp/work/rootfs/www -type f 2>/dev/null | wc -l
            echo ""
            echo "===== www 树 ====="
            find /tmp/work/rootfs/www -maxdepth 2 2>/dev/null | head -50
            echo ""
            echo "===== JS ====="
            find /tmp/work/rootfs/www -name "*.js" 2>/dev/null | head -10
            echo ""
            echo "===== 自研痕迹 hiwifi ====="
            find /tmp/work/rootfs -maxdepth 3 -iname "*hiwifi*" 2>/dev/null | head -20
            echo ""
            echo "===== etc/config ====="
            ls /tmp/work/rootfs/etc/config/ 2>/dev/null | tr '\n' ' '
            echo ""
            echo "===== init.d ====="
            ls /tmp/work/rootfs/etc/init.d/ 2>/dev/null | tr '\n' ' '
            echo ""
            echo "===== Web 服务器 ====="
            ls /tmp/work/rootfs/usr/sbin/ 2>/dev/null | grep -iE "http|nginx|lighttpd|uhttpd" | tr '\n' ' '
            echo ""
            echo "===== 后端语言 ====="
            ls /tmp/work/rootfs/usr/bin/ 2>/dev/null | grep -iE "^(lua|python|php|node)" | tr '\n' ' '
            echo ""
            echo "===== opkg 包 ====="
            grep "^Package:" /tmp/work/rootfs/usr/lib/opkg/status 2>/dev/null | head -45 | tr '\n' ' '
          } > "$R" 2>&1
          cd /tmp/work/rootfs 2>/dev/null && tar czf "$GITHUB_WORKSPACE/stock-analysis/www.tar.gz" www 2>/dev/null || echo "打包跳过"
          ls -lh "$GITHUB_WORKSPACE/stock-analysis/" 2>/dev/null

      - name: 回传分析结果
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.email "action@users.noreply.github.com"
          git config user.name "GitHub Action"
          git add stock-analysis/ 2>/dev/null
          git commit -m "原厂固件分析结果 [skip ci]" 2>/dev/null || echo "无变化"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/xiaodiudiu52/besos.git HEAD:master 2>&1 | tail -2
